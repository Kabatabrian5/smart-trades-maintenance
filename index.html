<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Trades - System Maintenance</title>
  <style>
    body { background: #0b0e14; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .container { text-align: center; padding: 40px; }
    .logo { font-size: 28px; font-weight: bold; color: #00d09c; margin-bottom: 20px; }
    h1 { font-size: 24px; margin-bottom: 10px; }
    p { color: #848e9c; max-width: 400px; margin: 0 auto 30px; }
    .loader { border: 4px solid #1e222d; border-top: 4px solid #00d09c; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Smart Trades</div>
    <div class="loader"></div>
    <h1>System Maintenance</h1>
    <p>We are currently upgrading our AI trading infrastructure. Please check back shortly.</p>
  </div>
</body>
</html>
