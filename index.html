<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Maintenance - Smart Trades</title>
  <style>
    body {
      background: #0b0e14;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .maintenance-card {
      background: #12161f;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 50px 40px;
      text-align: center;
      width: 440px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .gear-container {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 24px auto;
    }
    .gear {
      width: 100%;
      height: 100%;
      border: 6px dashed #00d09c;
      border-radius: 50%;
      animation: spin 6s linear infinite;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gear-inner {
      width: 32px;
      height: 32px;
      background: #00d09c;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.85); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    h1 {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #f3f4f6;
    }
    p {
      font-size: 14px;
      color: #9ca3af;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 208, 156, 0.1);
      color: #00d09c;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid rgba(0, 208, 156, 0.2);
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #00d09c;
      border-radius: 50%;
      box-shadow: 0 0 8px #00d09c;
      animation: blink 1.5s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="maintenance-card">
    <div class="gear-container">
      <div class="gear">
        <div class="gear-inner"></div>
      </div>
    </div>
    <h1>System Maintenance</h1>
    <p>We are currently upgrading our trading engine and infrastructure to serve you better. We will be back online shortly.</p>
    <div class="status-badge">
      <div class="dot"></div>
      Maintenance in Progress
    </div>
  </div>

</body>
</html>
